# RAGFlow 编排（取自 infiniflow/ragflow v0.17.0 的 docker/docker-compose.yml）。
# 相对官方文件只改两处：端口映射改为 ${SVR_HTTP_PORT}:9380 与 ${WEB_PORT}:80，
# 去掉 443 映射，避免与本机已占用的 80/443 冲突；其余保持官方原样，便于对照升级。
# 启动请用 scripts/ragflow-up.sh：它会补 .env、检查守护进程、等 API 就绪并建知识库。
include:
  - ./docker-compose-base.yml

services:
  ragflow:
    depends_on:
      mysql:
        condition: service_healthy
    image: ${RAGFLOW_IMAGE}
    container_name: ragflow-server
    # 官方只发布 linux/amd64 镜像，Apple Silicon 上明确走模拟，避免每次拉起都报警告
    platform: linux/amd64
    ports:
      - ${SVR_HTTP_PORT}:9380
      - ${WEB_PORT}:80
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file: .env
    environment:
      - TZ=${TIMEZONE}
      - HF_ENDPOINT=${HF_ENDPOINT}
      - MACOS=${MACOS}
    networks:
      - ragflow
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

