services:
  mysql:
    image: mysql:8.0.40
    container_name: tracelink-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tracelink}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tracelink}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-tracelink}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
