server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: tracelink
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:tracelink}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:tracelink}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST:110MB}
      file-size-threshold: 1MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

tracelink:
  auth:
    jwt:
      secret: ${JWT_SECRET:tracelink-dev-secret-key-please-change-0123456789}
      ttl-minutes: 480
  storage:
    root: ${TL_STORAGE_ROOT:./data/files}
  import:
    max-rows: 5000
    similarity-threshold: 0.85
  kb:
    max-file-size-mb: ${KB_MAX_FILE_MB:50}
    chunk:
      target-size: 500
      overlap-ratio: 0.15
    search:
      threshold: 0.2
    history:
      lookback-days: 365
  ai:
    ark:
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      api-key: ${ARK_API_KEY:}
      chat:
        model: ${ARK_CHAT_MODEL:}
        temperature: 0.2
        max-tokens: 4096
        timeout-seconds: 30
    ragflow:
      enabled: ${RAGFLOW_ENABLED:false}
      base-url: ${RAGFLOW_BASE_URL:http://127.0.0.1:9380}
      api-key: ${RAGFLOW_API_KEY:}
      dataset-id: ${RAGFLOW_DATASET_ID:default}
      timeout-seconds: 15
      degrade-on-error: LOCAL_FULLTEXT

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    io.tracelink: debug
